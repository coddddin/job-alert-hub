<!doctype html>
<html lang="ko"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>공개 공고 검증 · Job Alert Hub</title>
  <link rel="stylesheet" href="./preview.css">
  <script type="importmap">{"imports":{"kr-job-parser":"./vendor/kr-job-parser/index.js"}}</script>
  <script type="module" src="./preview.js"></script>
</head><body><main>
  <header><span class="eyebrow">JOB ALERT HUB / PREVIEW</span><h1>수집한 공고를 확인하세요</h1>
  <p>공개 페이지에서 읽은 원문과 해석 결과입니다. 지원 조건은 원본 공고에서 다시 확인하세요.</p>
  <p class="notice">검증용 미리보기 · 공공기관 운영 데이터와 분리 · 직무 적합도 추천 아님</p></header>
  <section class="filters" aria-label="공고 필터">
    <label>회사·제목·근무지<input id="keyword" type="search" placeholder="검색어 입력"></label>
    <label>근무지역<select id="region"><option value="all">전체 지역</option></select></label>
    <label>공고 출처<select id="source"><option value="all">전체 출처</option></select></label>
    <label>경력<select id="experience"><option value="all">전체 경력</option><option value="new">신입</option><option value="new-or-experienced">신입·경력</option><option value="experienced">경력</option><option value="any">경력무관</option><option value="unknown">확인 필요</option></select></label>
    <label class="check"><input id="closed" type="checkbox" checked>마감 공고 포함</label>
  </section>
  <p id="summary" role="status">공고를 불러오는 중입니다.</p>
  <div id="jobs" class="jobs"></div>
</main></body></html>
