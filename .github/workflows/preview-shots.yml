# 임시: 공채달력 iframe이 실제 브라우저에서 뜨는지 확인할 캡처. 머지 전에 지운다.
name: Preview shots (temporary)
on:
  push:
    branches: [feat/jobkorea-calendar]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile && pnpm build
      - run: pnpm --filter @job-alert-hub/web build:site -- "$RUNNER_TEMP/site/job-alert-hub" || node apps/web/scripts/build-site.mjs "$RUNNER_TEMP/site/job-alert-hub"
      - run: npx -y playwright@1 install --with-deps chromium
      - run: |
          cd "$RUNNER_TEMP/site" && (python3 -m http.server 4321 >/dev/null 2>&1 &) && sleep 1
          cat > "$RUNNER_TEMP/shot.mjs" <<'JS'
          import { chromium } from 'playwright';
          const out = process.env.RUNNER_TEMP + '/shots';
          const b = await chromium.launch(); const logs = [];
          for (const [name, vp] of [['calendar-desktop', { width: 1280, height: 1100 }], ['calendar-mobile', { width: 390, height: 844 }]]) {
            const p = await b.newPage({ viewport: vp, deviceScaleFactor: 2 });
            p.on('console', m => logs.push(`${name} ${m.type()}: ${m.text()}`));
            await p.goto('http://127.0.0.1:4321/job-alert-hub/');
            await p.click('[data-view="calendar"]');
            await p.waitForTimeout(6000);
            await p.screenshot({ path: `${out}/${name}.png` });
            await p.close();
          }
          console.log(logs.join('\n')); await b.close();
          JS
          mkdir -p "$RUNNER_TEMP/shots" && cd "$RUNNER_TEMP" && npm init -y >/dev/null && npm i playwright@1 >/dev/null && node shot.mjs
      - run: |
          cd "$RUNNER_TEMP/shots"
          git init -q -b data/preview-shots && git add . 
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm shots
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data/preview-shots
