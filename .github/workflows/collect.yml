name: Collect & Deploy

# 매일 아침 공공데이터 API에서 공고를 모아 GitHub Pages에 배포한다.
# 수집이 실패하면 배포하지 않으므로 Pages에는 마지막으로 성공한 화면이 남는다.
# 잡코리아·사람인은 선택 단계다. 하나가 실패하거나 비어 있으면 그 출처만 빠지고 나머지는 그대로 배포한다.
on:
  schedule:
    - cron: '17 21 * * *' # 매일 06:17 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [apps/**, packages/**, tools/public-jobs/**, pnpm-lock.yaml, .github/workflows/collect.yml]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Collect jobs
        run: pnpm --filter @job-alert-hub/collector collect
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - uses: actions/setup-python@v6
        continue-on-error: true
        with:
          python-version: '3.12'
      - name: Collect JobKorea (optional)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          python -m pip install -r tools/public-jobs/requirements.txt
          python tools/public-jobs/batch_live.py --count 40 --out .scrapling-local/jobkorea
      - name: Collect Saramin list (optional)
        continue-on-error: true
        timeout-minutes: 3
        # 검색 목록만 읽는다(상세 요청 없음). 2초 간격, 회당 10페이지 상한, 차단 신호면 부분 결과로 중지.
        run: python tools/public-jobs/saramin_list.py --max-pages 10 --out .scrapling-local/saramin
      - name: Merge private sources into snapshot (optional)
        continue-on-error: true
        run: >-
          node tools/public-jobs/merge-live.mjs --base apps/web/data/live/snapshot.json
          --batch .scrapling-local/jobkorea/batch.json --batch .scrapling-local/saramin/batch.json
      - name: Build static site
        run: pnpm --filter @job-alert-hub/web build:site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/site

  deploy:
    needs: collect
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
