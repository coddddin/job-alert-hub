name: Collect & Deploy

# 매일 아침 공공데이터 API에서 공고를 모아 GitHub Pages에 배포한다.
# 수집이 실패하면 배포하지 않으므로 Pages에는 마지막으로 성공한 화면이 남는다.
# 잡코리아·사람인은 선택 단계다. 하나가 실패하거나 비어 있으면 그 출처만 빠지고 나머지는 그대로 배포한다.
on:
  schedule:
    # GitHub 예약 실행은 부하가 크면 건너뛰어진다(11/17~24 매시 예약 중 약 20회만 실행).
    # 같은 시간대에 두 번 예약해 놓치는 시간을 줄인다. 겹치면 concurrency로 차례로 실행된다.
    - cron: '7 * * * *'
    - cron: '37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [apps/**, packages/**, tools/public-jobs/**, pnpm-lock.yaml, .github/workflows/collect.yml]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Collect jobs
        run: pnpm --filter @job-alert-hub/collector collect
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - uses: actions/setup-python@v6
        continue-on-error: true
        with:
          python-version: '3.12'
      - name: Previous deploy and plan (optional)
        continue-on-error: true
        # 이전 배포 스냅샷: 민간 공고 누적(이월)과, 최근 본 잡코리아 상세를 다시 요청하지 않는 데 쓴다.
        run: |
          mkdir -p .scrapling-local
          curl -fsS --max-time 30 "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/live/snapshot.json" -o .scrapling-local/previous.json || rm -f .scrapling-local/previous.json
          node tools/public-jobs/seen-ids.mjs .scrapling-local/previous.json jobkorea 24 > .scrapling-local/jobkorea-seen.txt
          # 사람인 기본 검색어를 소스에서 읽는다(import하면 아직 설치되지 않은 scrapling이 필요해 실패했다: 11/17~24 계획 미적용).
          defaults=$(python -c "import ast; t=ast.parse(open('tools/public-jobs/saramin_list.py', encoding='utf-8').read()); print(','.join(next(ast.literal_eval(n.value) for n in t.body if isinstance(n, ast.Assign) and getattr(n.targets[0], 'id', '') == 'QUERIES')))")
          node tools/public-jobs/collection-plan.mjs --plan tools/public-jobs/collection-plan.json --slots 10 --defaults "$defaults" | paste -sd, > .scrapling-local/saramin-queries.txt
          echo "saramin queries: $(cat .scrapling-local/saramin-queries.txt)"
          # 잡코리아: 검색어 8개(관심 직무군 70%), 검색어마다 1페이지 → 새 공고 상세 최대 40건.
          node tools/public-jobs/collection-plan.mjs --plan tools/public-jobs/collection-plan.json --slots 8 --defaults "$defaults" | paste -sd, > .scrapling-local/jobkorea-queries.txt
          echo "jobkorea queries: $(cat .scrapling-local/jobkorea-queries.txt)"
          # 계획이 비면 수집기가 예전 기본 동작으로 돌아간다. 조용히 넘어가지 않게 경고로 남긴다.
          for f in saramin jobkorea; do [ -s .scrapling-local/$f-queries.txt ] || echo "::warning::$f 검색어 계획이 비어 기본 검색어로 수집한다"; done
      - name: Collect JobKorea (optional)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          python -m pip install -r tools/public-jobs/requirements.txt
          queries=$(cat .scrapling-local/jobkorea-queries.txt 2>/dev/null || true)
          python tools/public-jobs/batch_live.py --count 40 --out .scrapling-local/jobkorea \
            ${queries:+--queries "$queries"} --seen .scrapling-local/jobkorea-seen.txt
      - name: Collect Saramin list (optional)
        continue-on-error: true
        timeout-minutes: 3
        # 검색 목록만 읽는다(상세 요청 없음). 2초 간격, 회당 10페이지 상한, 차단 신호면 부분 결과로 중지.
        # 수집 계획(관심 직무군 70%)의 검색어 10개, 검색어마다 1페이지.
        run: |
          queries=$(cat .scrapling-local/saramin-queries.txt 2>/dev/null || true)
          python tools/public-jobs/saramin_list.py --max-pages 10 --out .scrapling-local/saramin ${queries:+--queries "$queries" --offset 0}
      - name: Merge private sources into snapshot (optional)
        continue-on-error: true
        run: >-
          node tools/public-jobs/merge-live.mjs --base apps/web/data/live/snapshot.json
          --batch .scrapling-local/jobkorea/batch.json --batch .scrapling-local/saramin/batch.json
          --previous .scrapling-local/previous.json --plan tools/public-jobs/collection-plan.json
      - name: Build static site
        run: pnpm --filter @job-alert-hub/web build:site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/site

  deploy:
    needs: collect
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
