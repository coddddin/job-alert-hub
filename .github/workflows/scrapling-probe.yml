name: Scrapling proof of concept

on:
  push:
    branches: [feat/scrapling-optional-collector]
    paths:
      - "tools/scrapling-probe/**"
      - ".github/workflows/scrapling-probe.yml"
  pull_request:
    paths:
      - "tools/scrapling-probe/**"
      - ".github/workflows/scrapling-probe.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Scrapling fetcher dependencies
        run: python -m pip install -r tools/scrapling-probe/requirements.txt
      - name: Verify parser on local HTML fixture
        run: python -m unittest discover -s tools/scrapling-probe -p "test_*.py" -v
      - name: Live test on educational fake job listings
        run: python tools/scrapling-probe/probe.py --target demo
      - name: Read-only JobKorea robots policy audit
        if: always()
        run: python tools/scrapling-probe/probe.py --target jobkorea
